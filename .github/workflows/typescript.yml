name: TypeScript (web)
on:
  push:
    paths: ["typescript/**", ".github/workflows/typescript.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: typescript
      - run: npm run build
        working-directory: typescript
      - name: Prepare site
        run: mkdir site && cp typescript/index.html site/ && cp -r typescript/dist site/
      - uses: actions/upload-artifact@v4
        with:
          name: war2d-web
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true   # спрацює, лише якщо в Settings → Pages обрано "GitHub Actions"
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
